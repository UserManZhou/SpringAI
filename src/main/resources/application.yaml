# Spring Boot 应用配置
spring:
  # 应用基本信息
  application:
    name: SpringAI  # 应用名称

  # DevTools 热部署配置
  devtools:
    # LiveReload 浏览器自动刷新
    livereload:
      enabled: true  # 启用 LiveReload 功能
    # 应用重启配置
    restart:
      additional-paths: src/main/java  # 监控额外路径的文件变化
      exclude: static/**  # 排除静态资源文件，避免不必要的重启

  # Spring AI 配置
  ai:
    # Ollama 本地大模型配置
    ollama:
      chat: # 聊天模型配置
        model: deepseek-r1:8b  # 使用的模型名称

# 日志配置
logging:
  # 日志编码设置
  charset:
    console: utf-8  # 控制台日志编码
    file: utf-8     # 文件日志编码
  # 日志级别配置
  level:
    org.springframework.ai.chat.client.advisor: DEBUG  # Spring AI 顾问组件的调试日志